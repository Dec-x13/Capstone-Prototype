# Working values for the feasibility prototype.
# These are NOT the validated thresholds of Section 4.2.2; those will be set on validation data later.

[windows]
k_options = [1, 3, 5, 10]
k_default = 5
n_options = [50, 100, 150, 200]
n_default = 100
burst_gap_seconds = 60

[features]
long_bubble_words = 15          # a bubble with more than this many words is "long"
hour_smoothing_alpha = 1.0      # additive (Laplace) smoothing for the hour-of-day profile
ngram_min = 2
ngram_max = 4
near_identical_similarity = 0.9 # char n-gram cosine similarity for "repeated sending"

[language]
# Dominant-mix rule: among Bikol/Tagalog/English words, if the second most common language has at least
# this share, the window is a mix of the top two (Bi-lish, Tag-col, Taglish); otherwise the top language alone.
mix_second_share = 0.20

[deviation]
z_threshold = 2.0               # |z| above this marks a feature as deviating (working value)
std_floor = 0.05                # guards against std = 0
context_min_windows = 10        # windows to the same recipient needed for a context-matched baseline

[scorer]
detector = "isolation_forest"   # pluggable; later: "extended_isolation_forest", "one_class_svm"
# What the detector sees for each window:
#   "group_max" = the largest |z| in each of the six behaviour groups (6 numbers)  [default]
#   "features"  = every feature's z-score (24 numbers)
# On the synthetic sample the 24-number input hid large deviations: an Isolation Forest picks split
# features at random and cannot split on features that never vary in the baseline.
detector_input = "group_max"
n_estimators = 200
random_state = 42
small_baseline_windows = 30     # below this, the simple max-|z| fallback is emphasised

[risk]
# Prototype cutoffs: percentile of the window's score among the owner's own baseline windows.
medium_percentile = 95
high_percentile = 99
high_min_agreement = 2          # High also requires at least this many behaviour groups changed
