[server]
headless = true
address = "localhost"

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[client]
toolbarMode = "minimal"

# System font stack only: nothing is fetched from the internet.
[theme]
base = "light"
font = "Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif"
headingFont = "Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif"
baseFontSize = 18
headingFontSizes = ["34px", "28px", "22px", "19px", "18px", "18px"]
headingFontWeights = [650, 650, 600, 600, 600, 600]
baseRadius = "4px"
buttonRadius = "4px"
showWidgetBorder = true

# Palette: Ink #16233A · Paper #FAF8F3 · Shelf #ECEFF3 · Naga teal #0E6B6B
[theme.light]
primaryColor = "#0E6B6B"
backgroundColor = "#FAF8F3"
secondaryBackgroundColor = "#ECEFF3"
textColor = "#16233A"
linkColor = "#0E6B6B"
borderColor = "#C9CFD8"
greenColor = "#2F6B3F"
orangeColor = "#8F5A00"
redColor = "#9C3B2B"

[theme.light.sidebar]
backgroundColor = "#ECEFF3"

[theme.dark]
primaryColor = "#5FB8B3"
backgroundColor = "#121A26"
secondaryBackgroundColor = "#1C2735"
textColor = "#ECEFF3"
linkColor = "#5FB8B3"
borderColor = "#3A4757"
greenColor = "#7CC08E"
orangeColor = "#E0A84A"
redColor = "#E58A79"

[theme.dark.sidebar]
backgroundColor = "#1C2735"
